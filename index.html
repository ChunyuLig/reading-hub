<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读书馆 · 拆书笔记 & 国学经典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sb-head">
      <div class="brand">
        <span class="brand-mark">📖</span>
        <div>
          <div class="brand-title">读书馆</div>
          <div class="brand-sub">拆书笔记 · 国学经典</div>
        </div>
      </div>
      <input id="search" type="text" placeholder="搜索书名 / Search…" autocomplete="off">
    </div>
    <nav id="booklist"></nav>
    <div class="sb-foot">
      <span id="bookcount"></span>
      <span class="sb-foot-hint">为 INTP 深读而做 · 逻辑 · 全局 · 深因</span>
    </div>
  </aside>

  <!-- Main -->
  <main id="main">
    <header id="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="menu">☰</button>
      <div id="crumb"></div>
      <div class="topbar-right">
        <div id="langToggle" class="lang-toggle" role="group" aria-label="language">
          <button data-lang="en" class="active">EN</button>
          <button data-lang="zh">中文</button>
        </div>
        <button id="tocBtn" class="icon-btn" title="本书目录">⋮</button>
      </div>
    </header>

    <div id="reader">
      <div id="content"></div>
      <aside id="toc"></aside>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
